# Salvar em .github/workflows/uptime.yml
name: uptime-monitor

on:
  schedule:
    - cron: "*/15 * * * *"   # checagem a cada 15 min (UTC)
    - cron: "2 11 * * *"     # heartbeat diário ~8h de Brasília
  workflow_dispatch:          # permite rodar manualmente para testar

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python monitor.py ${{ github.event.schedule == '2 11 * * *' && '--heartbeat' || '' }}
        env:
          SITES: ${{ secrets.SITES }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          MENTIONS: ${{ secrets.MENTIONS }}
